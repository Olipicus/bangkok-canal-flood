<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#10161d">
<title>คลองกรุงเทพฯ — แผนที่สถานการณ์น้ำท่วม</title>
<link rel="icon" type="image/png" href="images/logo-96.png">
<link rel="apple-touch-icon" href="images/logo-180.png">
<link rel="stylesheet" href="vendor/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<button id="sidebar-toggle" title="สลับแผงข้อมูล">☰</button>
<button id="help-toggle" aria-controls="help-panel" aria-expanded="false" title="วิธีใช้">?</button>

<div id="help-panel" class="hidden" role="dialog" aria-labelledby="help-title">
  <div class="help-head">
    <h2 id="help-title" data-i18n="help_title"></h2>
    <button id="help-close" type="button" title="ปิด">✕</button>
  </div>
  <div class="intro">
    <p data-i18n="intro_lead"></p>
    <ul>
      <li data-i18n="intro_flash"></li>
      <li data-i18n="intro_river"></li>
      <li data-i18n="intro_tidal"></li>
      <li data-i18n="intro_mixed"></li>
    </ul>
    <p class="hint" data-i18n="intro_hint"></p>
  </div>
</div>

<div id="backdrop" aria-hidden="true"></div>

<aside id="sidebar">
  <header>
    <div class="title-row">
      <img src="images/logo-96.png" alt="" class="app-logo" width="40" height="40">
      <h1 data-i18n="app_title">คลองกรุงเทพฯ</h1>
      <button id="sidebar-close" type="button" title="ปิดแผงข้อมูล">✕</button>
      <div id="lang-toggle" role="group" aria-label="Language / ภาษา">
        <button id="lang-th" type="button" class="active" title="ไทย">ไทย</button>
        <button id="lang-en" type="button" title="English">EN</button>
      </div>
    </div>
  </header>

  <section class="stats" id="stats"></section>

  <section class="loc-ctl">
    <h2 data-i18n="loc_h"></h2>
    <div class="loc-row">
      <input type="search" id="loc-input" data-i18n-ph="loc_input_ph" autocomplete="off">
      <button id="loc-go" type="button" data-i18n="loc_btn"></button>
    </div>
    <div class="loc-row2">
      <button id="loc-pick" type="button"><span class="when-off" data-i18n="loc_pick"></span><span class="when-on" data-i18n="loc_pick_active"></span></button>
    </div>
    <div class="loc-row3">
      <label for="loc-radius" data-i18n="loc_radius_label"></label>
      <select id="loc-radius"></select>
    </div>
    <div id="loc-msg" class="loc-msg"></div>
  </section>

  <section class="controls">
    <h2 data-i18n="status_h"></h2>
    <div class="filters">
      <label class="risk-filter" data-status="critical"><input type="checkbox" id="f-critical" checked><span class="swatch critical"></span><span data-i18n="status_critical"></span></label>
      <label class="risk-filter" data-status="warning"><input type="checkbox" id="f-warning" checked><span class="swatch warning"></span><span data-i18n="status_warning"></span></label>
      <label class="risk-filter" data-status="normal"><input type="checkbox" id="f-normal" checked><span class="swatch normal"></span><span data-i18n="status_normal"></span></label>
      <label class="risk-filter" data-status="dry"><input type="checkbox" id="f-dry" checked><span class="swatch dry"></span><span data-i18n="status_dry"></span></label>
    </div>
    <label class="struct-filter"><input type="checkbox" id="f-live" checked>
      <span class="live-halo-dot" aria-hidden="true"></span><span data-i18n="live_halo"></span></label>
    <label class="struct-filter"><input type="checkbox" id="f-struct" checked>
      <span data-i18n="structs"></span></label>
    <input type="search" id="search" data-i18n-ph="search_ph" autocomplete="off">
    <ul id="canal-list"></ul>
  </section>

  <section class="live" id="live-panel"></section>

  <footer data-i18n="footer"></footer>
</aside>

<div id="map"></div>
<div id="trace-chip" class="hidden">
  <span id="chip-loc" class="hidden"></span>
  <label id="chip-select-all" class="hidden"><input type="checkbox" id="chip-select-all-box"><span data-i18n="select_all"></span></label>
  <button id="chip-here" type="button" data-i18n="loc_here"></button>
</div>

<aside id="detail-panel">
  <header>
    <h2 id="detail-title" data-i18n="details"></h2>
    <button id="detail-collapse" type="button" aria-expanded="true" aria-controls="detail-body" title="หุบแผงข้อมูล">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <button id="detail-close" type="button" title="ล้างการเลือกและปิด">✕</button>
  </header>
  <div id="detail-body"></div>
</aside>

<script src="vendor/leaflet.js"></script>
<script src="data/canals_data.js"></script>
<script src="data/live_status.js"></script>
<script src="data/flood69.js"></script>
<script src="app.js"></script>
</body>
</html>
